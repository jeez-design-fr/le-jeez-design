<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formules | Le Work du Jeez</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-green: #39ff14;
            --neon-blue: #00f3ff;
            --black: #000000;
            --white: #ffffff;
            --font-title: 'Bebas Neue', sans-serif;
            --font-text: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: var(--font-text);
            /* Ici on remet le scroll normal pour pouvoir descendre sur la page */
            overflow-x: hidden;
            overflow-y: auto; 
            padding: 20px;
        }

        /* BOUTON RETOUR */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--neon-green);
            text-decoration: none;
            font-family: var(--font-title);
            font-size: 1.5rem;
            z-index: 100;
            transition: 0.3s;
        }
        .back-btn:hover {
            color: var(--white);
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1000px;
            margin: 80px auto;
            text-align: center;
        }

        .main-title {
            font-family: var(--font-title);
            font-size: 4rem;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ RETOUR</a>

    <div class="container">
        <h1 class="main-title">MES FORMULES</h1>
        <p style="font-size: 1.5rem; color: #888;">(Cette page est en cours de construction...)</p>
        
        </div>

</body>
</html>
