<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Work de Jeez - Création de Contenu, Vidéo, Pub, Design & Web à Toulouse</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="google-site-verification" content="QklSBl4UXaFE33MZ0CwOoLmm6EpCsEMSqlKDSzmnbpk" />
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-green: #39ff14;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            /* Couleurs Spécifiques Bio */
            --bio-red: #ff0000;
            --bio-blue: #003dff;
            
            --black: #000000;
            --white: #ffffff;
            
            --font-title: 'Bebas Neue', sans-serif;
            --font-text: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: var(--font-text);
            overflow: hidden; 
            width: 100vw; height: 100vh;
            position: fixed;
        }

        /* --- ANIMATIONS GLOBALES --- */
        @keyframes tv-turn-off {
            0% { transform: scale(1, 1); filter: brightness(1); }
            40% { transform: scale(1, 0.002); filter: brightness(3); }
            80% { transform: scale(0, 0.002); }
            100% { transform: scale(0, 0); }
        }
        .turn-off-anim { animation: tv-turn-off 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; pointer-events: none; z-index: 9999; position: fixed; top:0; left:0; width:100%; height:100%; background:black;}

        .glitch-out {
            animation: glitch-anim 0.4s cubic-bezier(.25, .46, .45, .94) both infinite;
            filter: contrast(200%) brightness(150%);
        }
        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-10px, 10px); clip-path: inset(10% 0 80% 0); }
            40% { transform: translate(10px, -10px); clip-path: inset(80% 0 10% 0); }
            60% { transform: translate(-5px, 5px); clip-path: inset(40% 0 40% 0); filter: hue-rotate(90deg); }
            80% { transform: translate(5px, -5px); clip-path: inset(10% 0 60% 0); }
            100% { transform: translate(0); }
        }

        /* Scintillement Bouton OFF */
        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; box-shadow: 0 0 20px red; }
            20%, 24%, 55% { opacity: 0.5; box-shadow: none; }
        }
        
        /* Scintillement Mot Devis */
        @keyframes rare-flash {
            0%, 92%, 94%, 96%, 100% { opacity: 1; text-shadow: 0 0 10px var(--neon-green); }
            93%, 95% { opacity: 0.3; text-shadow: none; }
        }

        /* Animation GLOW PRECIEUX (Bio Titre) */
        @keyframes precious-glow {
            0%, 100% { text-shadow: 0 0 10px rgba(57, 255, 20, 0.2); opacity: 0.9; }
            50% { text-shadow: 0 0 25px rgba(57, 255, 20, 0.6); opacity: 1; }
        }

        /* Animation CLIGNEMENT ŒIL */
        @keyframes eye-blink {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        .blink-now { transform-origin: center; animation: eye-blink 0.2s linear; }

        /* Animation FLÈCHE SCROLL */
        @keyframes scroll-hint-anim {
            0% { opacity: 0; transform: translateY(-20px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(20px); }
            100% { opacity: 0; transform: translateY(40px); }
        }
        .play-anim { animation: scroll-hint-anim 2s ease-in-out forwards; }


        /* ========================
           SYSTEME DE LAYERS
           ======================== */
        .layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; 
            opacity: 0; 
            transition: opacity 0.4s ease;
            z-index: 10;
        }
        
        .layer.active {
            opacity: 1;
            pointer-events: auto;
            display: flex; /* Flex par défaut */
            z-index: 100;
        }

        /* Feeds scrollables */
        #feed, #image-feed {
            display: none; 
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y;
        }
        #feed.active { display: block; } 
        #image-feed.active { display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 40px; }


     /* ========================
           1. INTRO LAYER
           ======================== */
        #intro-layer { 
            background-color: #000; 
            display: flex; justify-content: center; align-items: center; 
            z-index: 500; 
            overflow: hidden;
            width: 100vw; height: 100vh;
        }
        
        #grid-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }

        #enter-btn {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 10;
        }

        .logo-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        /* --- 1. LOGO FOND "LE WORK" (VIOLET - SANS GLOW) --- */
        .logo-lework {
            position: absolute;
            /* TAILLE DE "LE WORK" : modifie width et max-width ici */
            width: 75%; max-width: 600px;
            
            /* POSITIONMENT DE "LE WORK" (Par défaut centré) */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            
            opacity: 0.85;
            z-index: 2;
            transition: filter 0.1s ease-out;
        }

        /* --- 2. LOGO PREMIER PLAN "JEEZ" (VERT - AVEC GLOW & FLOTTAISON PIXEL) --- */
        .logo-jeez {
            position: absolute;
            /* TAILLE DE "JEEZ" : modifie width et max-width ici */
            width: 90%; max-width: 600px;
            
            /* POSITIONNEMENT DE "JEEZ" : modifie top et left pour ajuster son placement */
            top: 50%; 
            left: 50%;
            
            z-index: 3;
            /* GLOW UNIQUEMENT SUR JEEZ EN VERT (#30ff66) */
            filter: drop-shadow(0 0 18px #30ff66) brightness(1.2);
            
            /* ANIMATION FLOTTAISON PIXEL RÉTRO (Mouvement saccadé) */
            animation: pixelFloat 2.5s steps(5) infinite;
        }

        /* Animation de flottaison rétro/pixel (utilisant steps() pour l'effet saccadé) */
        @keyframes pixelFloat {
            0%   { transform: translate(-50%, -50%) translateY(0px); }
            25%  { transform: translate(-50%, -50%) translateY(-8px); }
            50%  { transform: translate(-50%, -50%) translateY(0px); }
            75%  { transform: translate(-50%, -50%) translateY(8px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }
        /* ========================
           1.5. MENU LAYER
           ======================== */
        #menu-layer { 
            background-color: #000; 
            flex-direction: column; justify-content: center; align-items: center; 
            z-index: 450;
        }
        
        #portfolio-btn {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.2);
            width: 300px; height: 80px; /* Même taille que l'intro */
        }
        #portfolio-btn:hover { 
            border-color: var(--neon-purple); 
            box-shadow: 0 0 20px var(--neon-purple); 
        }
        #portfolio-btn:hover .center-text { 
            color: var(--neon-purple); 
        }

        /* BOUTON FORMULES */
        #formules-btn {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            width: 300px; height: 80px;
        }
        #formules-btn .center-text {
            color: var(--white);
        }
        #formules-btn:hover {
            border-color: var(--white);
            box-shadow: 0 0 20px var(--white);
        }
        #formules-btn:hover .center-text {
            color: var(--neon-green);
        }

        /* BOUTON ARTICLES & FAQ */
        #articles-btn {
            border-color: var(--white);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            width: 300px; height: 80px;
        }
        #articles-btn .center-text {
            color: var(--neon-green);
        }
        #articles-btn:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
        }
        #articles-btn:hover .center-text {
            color: var(--white);
        }

        /* ========================
           2. BIO LAYER
           ======================== */
        #bio-layer { 
            background-color: #000; 
            flex-direction: column; justify-content: space-evenly; align-items: center; text-align: center; padding: 10px;
            z-index: 400;
        }

        .bio-content { display: flex; flex-direction: column; gap: 1.5vh; width: 100%; max-width: 500px; }
        .bio-text { font-family: var(--font-title); text-transform: uppercase; line-height: 1.2; letter-spacing: 1px; font-size: 1.5rem; }
        @media (max-width: 600px) { .bio-text { font-size: 6vw; } }
        
        .bio-title { 
            font-family: var(--font-title); font-size: 4rem; color: var(--neon-green); margin-bottom: 5px; 
            animation: precious-glow 4s ease-in-out infinite; 
        }
        @media (max-width: 600px) { .bio-title { font-size: 14vw; } }
        
        .flicker-text { font-family: var(--font-title); color: var(--white); font-size: 2rem; margin-top: 15px; animation: text-flicker 3s infinite alternate; }
        @keyframes text-flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 5px rgba(255, 255, 255, 0.5); opacity: 1; } 20%, 24%, 55% { text-shadow: none; opacity: 0.3; } }
        
        .choice-container { display: flex; gap: 20px; width: 100%; justify-content: center; margin-top: 10px; }
        .choice-btn { padding: 15px 10px; width: 45%; max-width: 180px; font-family: var(--font-title); font-size: 1.8rem; background: black; border: 2px solid; cursor: pointer; color: white; animation: float-shake 3s ease-in-out infinite; }
        @keyframes float-shake { 0% { transform: translateY(0px) rotate(0deg); } 33% { transform: translateY(-3px) rotate(1deg); } 66% { transform: translateY(3px) rotate(-1deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        
        /* COULEURS DES BOUTONS BIO */
        .btn-images { border-color: var(--bio-red); box-shadow: 0 0 15px var(--bio-red); }
        .btn-images:hover { background-color: var(--bio-red); color: white; }
        
        .btn-videos { border-color: var(--bio-blue); box-shadow: 0 0 15px var(--bio-blue); animation-delay: 1.5s; }
        .btn-videos:hover { background-color: var(--bio-blue); color: white; }


        /* ========================
           3. UI LAYER (SIDEBAR)
           ======================== */
        #ui-layer { 
            z-index: 9000; pointer-events: none; display: none;
        }
        #ui-layer.active { display: block; opacity: 1; } 
        
        #scroll-hint {
            position: fixed; left: 15px; bottom: 35%;
            z-index: 9005; opacity: 0; pointer-events: none;
            color: var(--neon-green);
        }
        #scroll-hint svg { width: 40px; height: 40px; fill: currentColor; filter: drop-shadow(0 0 5px var(--neon-green)); }

        .fixed-sidebar { 
            position: fixed; right: 15px; bottom: 35%; 
            display: flex; flex-direction: column; gap: 25px; align-items: center; 
            pointer-events: auto; z-index: 9001; 
        }
        .side-btn { width: 55px; height: 55px; border-radius: 50%; background: rgba(0, 0, 0, 0.4); border: 2px solid var(--white); color: var(--white); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .side-btn svg { width: 28px; height: 28px; fill: currentColor; }
        #phone-btn:hover { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); transform: scale(1.15); }
        #mail-btn:hover { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); transform: scale(1.15); }
        #heart-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); transform: scale(1.15); }
        
        .glow-active-green { background: var(--neon-green) !important; color: black !important; box-shadow: 0 0 25px var(--neon-green); }
        .glow-active-blue { background: var(--neon-blue) !important; color: black !important; box-shadow: 0 0 25px var(--neon-blue); }
        .glow-active-red { background: var(--neon-pink) !important; color: white !important; box-shadow: 0 0 25px var(--neon-pink); }

        .sound-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 9005;
            background: rgba(0,0,0,0.5); color: var(--neon-green);
            cursor: pointer; font-family: var(--font-title); font-size: 1.5rem;
            text-transform: uppercase; padding: 5px 15px; 
            border: 1px solid var(--neon-green); backdrop-filter: blur(4px);
            padding-top: 8px; display: none; pointer-events: auto;
            transition: opacity 0.3s;
        }

        .fixed-eye-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 9000; display: flex; flex-direction: column; align-items: center; opacity: 0; pointer-events: none; transition: opacity 1s 1s; }
        .fixed-eye-container.hidden { opacity: 0 !important; pointer-events: none !important; }
        #ui-layer.active .fixed-eye-container { opacity: 1; pointer-events: auto; }
        .static-hd-text { color: var(--white); font-family: var(--font-title); font-size: 1.2rem; margin-bottom: 8px; }
        .eye-btn-main { width: 70px; height: 70px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 2px solid var(--neon-green); color: var(--neon-green); display: flex; justify-content: center; align-items: center; text-decoration: none; backdrop-filter: blur(8px); }
        .eye-btn-main svg { width: 35px; height: 35px; fill: currentColor; }
        .eye-btn-main:hover { transform: scale(1.2); background: var(--neon-green); color: #000; box-shadow: 0 0 30px var(--neon-green); }

        .floating-msg { position: fixed; color: var(--neon-green); font-size: 1.5rem; font-weight: bold; pointer-events: none; animation: floatAndFade 1.2s forwards; z-index: 9990; font-family: var(--font-title); text-shadow: 2px 2px 0px black; white-space: nowrap; }
        @keyframes floatAndFade { 0% { opacity: 1; transform: translate(-150%, -50%) scale(0.5); } 100% { opacity: 0; transform: translate(-150%, -250%) scale(1.5); } }
        @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg) scale(1.1); } 75% { transform: rotate(-10deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1.1); } }
        .shaking { animation: shake 0.4s ease-in-out; }


        /* ========================
           4. FEEDS (SCROLLABLE)
           ======================== */
        #feed, #image-feed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch; touch-action: pan-y;
            z-index: 3000;
            display: none; 
        }
        #feed.active { display: block; }
        #image-feed.active { display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 40px; }

        /* VIDEO ITEMS */
        #feed { scroll-snap-type: y mandatory; }
        .video-section { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background: #000; border-bottom: 1px solid #111; overflow: hidden; flex-shrink: 0; }
        video { position: absolute; width: 100%; height: 100%; z-index: 1; opacity: 0; transition: opacity 0.5s; }
        .video-section.active video { opacity: 1; }
        @media (orientation: portrait) { video.vertical { object-fit: cover; } video.horizontal { object-fit: contain; } }
        @media (orientation: landscape) { video.vertical { object-fit: contain; } video.horizontal { object-fit: cover; } }

        /* INFO OVERLAY (TITRES VIDÉOS) */
        .info-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px 80px 40px 20px; /* Padding droite pour éviter sidebar */
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none; z-index: 2;
        }
        .info-overlay h2 {
            font-family: var(--font-title); font-size: 3rem; color: var(--neon-green);
            text-shadow: 2px 2px 0px var(--neon-purple); margin-bottom: 5px; transform: skew(-5deg);
        }
        .info-overlay p {
            font-family: var(--font-text); font-size: 1.1rem; max-width: 600px;
            color: #fff; text-shadow: 1px 1px 2px black; font-weight: 500;
        }

        /* IMAGE ITEMS */
        .feed-instruction { font-family: var(--font-title); font-size: 3rem; color: var(--white); text-align: center; margin-top: 10px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); animation: text-flicker 3s infinite alternate; flex-shrink: 0; }
        
        .thumb-container { width: 100%; max-width: 400px; border: 1px solid #333; cursor: pointer; transition: 0.3s; position: relative; flex-shrink: 0; pointer-events: auto; }
        /* HOVER MINIATURE EN VERT */
        .thumb-container:hover { border-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); transform: scale(1.02); }
        .thumb-img { width: 100%; display: block; }

        /* FIN */
        .final-section { position: relative; background-color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; scroll-snap-align: start; width: 100%; flex-shrink: 0; }
        .matrix-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; pointer-events: none; }
        .final-container { display: flex; flex-direction: column; gap: 30px; align-items: center; z-index: 20; width: 100%; max-width: 320px; position: relative; pointer-events: auto; }
        
        .btn-final-devis { 
            width: 300px; height: 80px; 
            border-color: var(--neon-green); background-color: rgba(57, 255, 20, 0.1); 
            box-shadow: 0 0 20px var(--neon-green);
            text-decoration: none; display: flex; justify-content: center; align-items: center;
            border-style: solid; border-width: 2px;
            cursor: pointer; pointer-events: auto;
        }
        .btn-final-devis .center-text { color: var(--neon-green); animation: rare-flash 6s infinite; }
        
        .btn-final-off { 
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid red; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; background: rgba(255,0,0,0.1); 
            animation: neon-flicker 2s infinite; 
            pointer-events: auto;
            margin-top: 40px; /* Plus d'espace */
        }   
        .btn-final-off svg { width: 35px; height: 35px; fill: red; }

        /* MODALS */
        .image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9500; display: none; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .image-modal.active { display: flex; opacity: 1; pointer-events: auto; }
        .modal-img { max-width: 100%; max-height: 90vh; object-fit: contain; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bump-anim { 0% { transform: scale(1); } 50% { transform: scale(1.05) rotate(1deg); } 100% { transform: scale(1); } }
        .anim-bump { animation: bump-anim 0.2s; }
        .tap-hint { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); color: white; font-family: var(--font-title); font-size: 1.5rem; letter-spacing: 2px; text-shadow: 0 0 5px black, 0 0 10px rgba(0,0,0,0.8); animation: text-flicker 2s infinite; pointer-events: none; width: 100%; text-align: center; }
        
        .close-modal { 
            position: absolute; top: 20px; right: 20px; z-index: 9501;
            border: 1px solid var(--neon-green); background: rgba(0,0,0,0.5);
            color: red; font-size: 1.5rem; padding: 5px 15px; cursor: pointer; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
        }
        .close-modal:hover { border-color: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }

        /* CONTACT MODAL */
        .contact-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .contact-modal.active { display: flex; animation: fadeIn 0.3s; pointer-events: auto; }
        .contact-form { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .contact-input, .contact-msg { background: #111; border: 1px solid var(--neon-green); color: white; padding: 15px; font-family: var(--font-text); font-size: 1rem; }
        .contact-submit { background: var(--neon-green); color: black; border: none; padding: 15px; font-family: var(--font-title); font-size: 1.5rem; cursor: pointer; }

/* ANIMATION DES REFLETS PREMIUM */
        @keyframes premium-shine {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* BOUTON AGENCES & FREELANCE */
        #agences-btn {
            background-color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            width: 300px; height: 80px;
            overflow: hidden; /* Indispensable pour bloquer les reflets dans le cadre */
            position: relative;
            transition: 0.3s ease;
        }
        #agences-btn .center-text {
            color: var(--black);
            font-weight: 700;
            text-shadow: none; /* On enlève l'ombre pour plus de lisibilité en noir */
        }
        /* Le reflet animé */
        #agences-btn::after {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 60%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.7), rgba(0,0,0,0.3), transparent);
            transform: skewX(-25deg);
            animation: premium-shine 4s infinite;
        }
        #agences-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--neon-green);
        }

        
    </style>
</head>
<body>

    <!-- FILTRES SVG -->
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="liquid-wave">
                <feTurbulence type="turbulence" baseFrequency="0 0.02" numOctaves="2" result="turbulence">
                    <animate attributeName="baseFrequency" values="0 0.01; 0 0.03; 0 0.01" dur="30s" repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="4" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- 1. INTRO -->
    <div id="intro-layer" class="layer active">
        <canvas id="grid-canvas"></canvas>
        <div id="enter-btn">
            <div class="logo-container">
                <img src="lework-logo.webp" class="logo-lework" alt="LE WORK">
                <img src="jeez-logo.webp" class="logo-jeez" alt="JEEZ">
            </div>
        </div>
    </div>

<div id="menu-layer" class="layer">
        <div class="menu-container" style="display: flex; flex-direction: column; gap: 30px; align-items: center;">
            <a href="portfolio.html" id="portfolio-btn" class="center-box" style="text-decoration: none;">
                <div class="center-text">PORTFOLIO</div>
            </a>

            <a href="agences.html" id="agences-btn" class="center-box" style="text-decoration: none; margin-top: 10px;">
                <div class="center-text">AGENCES DE COM</div>
            </a>
            

            <a href="articles.html" id="articles-btn" class="center-box" style="text-decoration: none;">
                <div class="center-text">ARTICLES & FAQ</div>
            </a>
            
            </div>
    </div>
    

<script>
        // --- ANIMATION : MATRICE DE POINTS (DOTS) & ABERRATION VIOLET / VERT ---
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        
        let targetX = w / 2, targetY = h / 2;
        let mouseX = w / 2, mouseY = h / 2;
        let velX = 0, velY = 0;

        window.addEventListener('resize', () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        });

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX; 
            mouseY = e.clientY;
        });

        // Dessin des points minuscules et rapprochés
        function drawDots(color, xOffset, yOffset, warpForce) {
            ctx.fillStyle = color;
            const dotSpacing = 16; // Espacement très rapproché
            const dotRadius = 0.9;  // Taille minuscule des points
            
            for (let x = 0; x <= w; x += dotSpacing) {
                for (let y = 0; y <= h; y += dotSpacing) {
                    let dx = x - targetX; 
                    let dy = y - targetY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let pull = Math.max(0, 180 - dist) / 180; // Zone d'influence
                    
                    let drawX = x + velX * pull * warpForce + xOffset;
                    let drawY = y + velY * pull * warpForce + yOffset;
                    
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, dotRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        let animationId;
        function animMatrix() {
            velX = (mouseX - targetX) * 0.12;
            velY = (mouseY - targetY) * 0.12;
            targetX += velX; 
            targetY += velY;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, w, h);
            
            ctx.globalCompositeOperation = 'screen';
            
            let speed = Math.sqrt(velX * velX + velY * velY);
            let intensity = Math.min(speed * 0.05, 0.6); 
            
            // 1. Points de base quasi invisibles (fond sombre)
            drawDots('rgba(255, 255, 255, 0.03)', 0, 0, 0.3);
            
            // 2. Points révélés par le mouvement
            if (intensity > 0.01) {
                // Violet #721fff (rgba: 114, 31, 255)
                drawDots(`rgba(114, 31, 255, ${intensity})`, velX * 0.6, velY * 0.6, 1.2);
                // Vert #30ff66 (rgba: 48, 255, 102)
                drawDots(`rgba(48, 255, 102, ${intensity})`, -velX * 0.6, -velY * 0.6, 0.6);
            }
            
            ctx.globalCompositeOperation = 'source-over';

            // --- ABERRATION CHROMATIQUE SUR LES LOGOS (VIOLET #721fff ET VERT #30ff66) ---
            const jeezLogo = document.querySelector('.logo-jeez');
            const leworkLogo = document.querySelector('.logo-lework');
            
            if (jeezLogo && leworkLogo) {
                let rX = velX * 0.4; 
                let rY = velY * 0.4;

                // Aberration Violet / Vert + Glow préservé UNIQUEMENT sur Jeez
                jeezLogo.style.filter = `drop-shadow(${rX}px ${rY}px 0 rgba(114,31,255,0.85)) drop-shadow(${-rX}px ${-rY}px 0 rgba(48,255,102,0.85)) drop-shadow(0 0 18px #30ff66) brightness(1.2)`;
                
                // Aberration légère sur "LE WORK" sans aucun Glow
                leworkLogo.style.filter = `drop-shadow(${rX * 0.5}px ${rY * 0.5}px 0 rgba(114,31,255,0.5)) drop-shadow(${-rX * 0.5}px ${-rY * 0.5}px 0 rgba(48,255,102,0.5))`;
            }
            
            animationId = requestAnimationFrame(animMatrix);
        }
        animMatrix();

        // --- CORRECTION DU CLIC DE TRANSITION VERS LE MENU ---
        document.getElementById('enter-btn').addEventListener('click', function() {
            const intro = document.getElementById('intro-layer');
            const menu = document.getElementById('menu-layer');
            
            // Arrêt de l'animation canvas
            if (animationId) cancelAnimationFrame(animationId);
            
            intro.classList.add('glitch-out');
            
            setTimeout(() => {
                intro.classList.remove('active', 'glitch-out');
                intro.style.display = 'none';
                
                // Activation du menu principal
                menu.style.display = 'flex';
                menu.style.zIndex = '999';
                setTimeout(() => {
                    menu.classList.add('active');
                }, 10);
            }, 400);
        });
    </script>
    
</body>
</html>
